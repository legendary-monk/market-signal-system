name: Weekly Market Signal Report

on:
  schedule:
    # Runs once weekly after Friday's regular market close: 6:00 PM IST (12:30 PM UTC).
    - cron: '30 12 * * 5'

  # Allows manual report generation for review or testing.
  workflow_dispatch:

jobs:
  generate-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser yfinance requests textblob pandas numpy
          python -m textblob.download_corpora

      - name: Run weekly market report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py run

      - name: Commit predictions back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: update weekly predictions.csv"
          file_pattern: predictions.csv

      - name: Upload logs if failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: market-signal-logs
          path: market_signal.log
