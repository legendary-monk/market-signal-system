name: Daily Market Signal

on:
  schedule:
    # Runs at 9:00 AM IST (3:30 AM UTC) Monday through Friday
    - cron: '30 3 * * 1-5'
  
  # Allows you to click a button to run it manually for testing
  workflow_dispatch:

jobs:
  generate-signal:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install feedparser yfinance requests textblob pandas numpy
          python -m textblob.download_corpora
      
      - name: Run market signal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py run
      
      - name: Commit predictions back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: update predictions.csv"
          file_pattern: predictions.csv

      - name: Upload logs if failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: market-signal-logs
          path: market_signal.log
          
